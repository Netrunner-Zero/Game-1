<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="3D-Autobahn-Rennspiel für Browser und Handy">
  <title>Highway Dodge 3D</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- Anzeige während der Fahrt -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="card">
        <div id="hudScore" class="big">0</div>
        <div id="hudBest" class="small">HI 0</div>
      </div>
      <div class="hud-buttons">
        <button id="soundBtn" class="round" aria-label="Ton ausschalten">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="cross" d="M16.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="pauseBtn" class="round" aria-label="Pause">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="card right">
        <div id="hudSpeed" class="big">0</div>
        <div class="small">km/h</div>
      </div>
    </div>
    <div id="popup" class="popup" aria-live="polite"></div>
    <div id="hint" class="hint"></div>
    <div id="pedals" class="pedals hidden">
      <button id="brakeBtn" class="pedal brake" aria-label="Bremse">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="9" width="14" height="6" rx="2" fill="currentColor"/></svg>
        Bremse
      </button>
      <button id="gasBtn" class="pedal gas" aria-label="Gas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l7 9h-4v7H9v-7H5z" fill="currentColor"/></svg>
        Gas
      </button>
    </div>
  </div>

  <section id="loading" class="overlay solid">
    <div class="spinner" aria-hidden="true"></div>
    <p>Lade 3D-Welt …</p>
  </section>

  <section id="error" class="overlay solid hidden">
    <div class="panel">
      <h2>Das hat leider nicht geklappt</h2>
      <p id="errorText"></p>
      <a class="btn primary" href="../">Zur 2D-Version</a>
    </div>
  </section>

  <section id="menu" class="overlay menu hidden">
    <header class="title">
      <h1>Highway Dodge <span>3D</span></h1>
      <p>Knapp überholen, ausweichen – und durchhalten bis in die Nacht.</p>
    </header>
    <div class="panel">
      <button id="startBtn" class="btn primary">Start</button>
      <p id="menuBest" class="best"></p>
      <div class="settings">
        <div class="row" id="controlRow">
          <span>Steuerung</span>
          <div class="seg" data-setting="control">
            <button data-value="touch">Tippen</button>
            <button data-value="tilt">Neigen</button>
          </div>
        </div>
        <div class="row">
          <span>Grafik</span>
          <div class="seg" data-setting="quality">
            <button data-value="auto">Auto</button>
            <button data-value="low">Niedrig</button>
            <button data-value="medium">Mittel</button>
            <button data-value="high">Hoch</button>
          </div>
        </div>
        <div class="row">
          <span>Ton</span>
          <div class="seg" data-setting="sound">
            <button data-value="on">An</button>
            <button data-value="off">Aus</button>
          </div>
        </div>
      </div>
      <p id="tiltNote" class="note hidden"></p>
      <p id="controlsHelp" class="help"></p>
      <a class="link" href="../">← Zur 2D-Version</a>
    </div>
  </section>

  <section id="pause" class="overlay dim hidden">
    <div class="panel narrow">
      <h2>Pause</h2>
      <button id="resumeBtn" class="btn primary">Weiter</button>
      <button id="restartBtn" class="btn">Neu starten</button>
      <button id="menuBtn" class="btn ghost">Menü</button>
    </div>
  </section>

  <section id="over" class="overlay dim hidden">
    <div class="panel narrow">
      <h2 class="crash">Crash!</h2>
      <div class="label">Punkte</div>
      <div id="overScore" class="score">0</div>
      <p id="overRecord" class="best"></p>
      <div class="stats">
        <div><span id="statDist">0 km</span><small>Strecke</small></div>
        <div><span id="statTop">0</span><small>Top-Speed</small></div>
        <div><span id="statNear">0</span><small>Knapp überholt</small></div>
      </div>
      <button id="againBtn" class="btn primary">Nochmal spielen</button>
      <button id="overMenuBtn" class="btn ghost">Menü</button>
    </div>
  </section>

  <script>
    // Fehlermeldung, falls der Browser zu alt ist oder das Laden scheitert
    (function () {
      window.__hd3dFail = function (msg) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('errorText').textContent = msg;
        document.getElementById('error').classList.remove('hidden');
        window.__hd3dFailed = true;
      };
      var gl = null;
      try { gl = document.createElement('canvas').getContext('webgl2'); } catch (e) { gl = null; }
      if (!gl) {
        window.__hd3dFail('Dein Browser oder Gerät unterstützt kein WebGL 2. Probier es mit einem aktuellen Chrome, Safari oder Firefox.');
        return;
      }
      if (!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'))) {
        window.__hd3dFail('Dein Browser ist zu alt für dieses Spiel. Bitte aktualisiere ihn.');
        return;
      }
      window.addEventListener('error', function (e) {
        if (!window.__hd3dReady && !window.__hd3dFailed) {
          window.__hd3dFail('Fehler beim Laden (' + (e.message || 'unbekannt') + '). Prüfe die Internetverbindung und lade die Seite neu.');
        }
      });
      setTimeout(function () {
        if (!window.__hd3dReady && !window.__hd3dFailed) {
          window.__hd3dFail('Das Laden dauert ungewöhnlich lange. Prüfe die Internetverbindung und lade die Seite neu.');
        }
      }, 30000);
    })();
  </script>
  <script type="module" src="js/main.js" onerror="window.__hd3dFail && window.__hd3dFail('Das Spiel konnte nicht geladen werden. Prüfe die Internetverbindung und lade die Seite neu.')"></script>
</body>
</html>
